<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Shikhar Mishra</title>
    <link rel="icon" type="image/png" href="assets/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }
        #container {
            max-width: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f5f5f5;
            color: #333333;
            padding: 0;
            margin-bottom: 40px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            max-width: 500px;
            margin-left: 20px;
        }
        nav {
            display: flex;
            margin: 0;
        }
        nav a {
            color: #7c7c7c;
            text-decoration: none;
            margin-right: 20px;
            font-size: 1em;
        }
        nav a:hover {
            text-decoration: underline;
        }
        nav a.active {
            font-weight: 600;
            color: #000;
        }
        #content {
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin-left: 20px;
        }
        section {
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        p, li {
            line-height: 1.8;
            font-size: 0.9em;
            color: #7c7c7c;
        }
        .blog-list {
            list-style: none;
            padding: 0;
        }
        .blog-link {
            display: block;
            padding: 15px 0;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }
        .blog-link:hover {
            background-color: #f0f0f0;
        }
        .blog-content {
            max-width: 100%;
            line-height: 1.6;
        }
        .blog-content h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }
        .blog-content h2, .blog-content h3 {
            font-size: 1.5em;
            margin: 20px 0;
            color: #333;
        }
        .blog-content p {
            margin: 15px 0;
            color: #333;
            font-size: 0.9em;
            line-height: 1.8;
        }
        .blog-content img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
        }
        .blog-content code {
            background-color: #f4f4f4;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
        .blog-content pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .back-to-list {
            display: inline-block;
            margin-bottom: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-to-list:hover {
            text-decoration: underline;
        }
        .blog-entries {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <nav>
                <a href="/personal-site/index.html">about</a>
                <a href="/personal-site/blogs.html" class="active">blogs</a>
                <a href="/personal-site/#projects">projects</a>
                <a href="https://github.com/Itssshikhar" target="_blank">github</a>
            </nav>
        </header>

        <div id="content">
            <section id="blog-list">
                <h2>Blogs</h2>
                <p>Welcome to my blog page. Here you will find my latest posts.</p>
                <div class="blog-entries"></div>
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const blogFiles = ['Sparse_Autoencoders_in_Interpretability.md'];
            const blogEntriesElement = document.querySelector('.blog-entries');
            const blogListSection = document.getElementById('blog-list');

            // Configure marked options and custom renderer
            const renderer = new marked.Renderer();
            
            // Custom image renderer to handle paths
            renderer.image = function(href, title, text) {
                console.log('Processing image in markdown:', href);
                
                // Fix relative paths
                let originalHref = href;
                if (href.startsWith('../assets/')) {
                    href = href.replace('../assets/', '/assets/');
                } else if (href.startsWith('/assets/')) {
                    // Keep as is
                } else if (href.startsWith('assets/')) {
                    href = '/' + href;
                }
                
                console.log('Transformed image path:', originalHref, '->', href);
                
                let out = `<img src="${href}" alt="${text}" data-original-src="${originalHref}"`;
                if (title) {
                    out += ` title="${title}"`;
                }
                out += '>';
                return out;
            };
            
            marked.setOptions({
                breaks: true,
                gfm: true,
                baseUrl: '/personal-site/',
                renderer: renderer
            });

            // Function to get formatted title from filename
            function getFormattedTitle(filename) {
                return filename
                    .replace('.md', '')
                    .split('_')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
            }

            // Function to display blog list
            function showBlogList() {
                blogListSection.innerHTML = `
                    <h2>Blogs</h2>
                    <p>Welcome to my blog page. Here you will find my latest posts.</p>
                    <div class="blog-entries"></div>
                `;
                const entriesDiv = blogListSection.querySelector('.blog-entries');
                
                blogFiles.forEach(file => {
                    const formattedTitle = getFormattedTitle(file);
                    const link = document.createElement('a');
                    link.href = '#' + file;
                    link.className = 'blog-link';
                    link.textContent = formattedTitle;
                    link.onclick = (e) => {
                        e.preventDefault();
                        loadAndDisplayBlogPost(file);
                    };
                    entriesDiv.appendChild(link);
                });
            }

            // Function to load and display a blog post
            function loadAndDisplayBlogPost(file) {
                console.log('Loading blog post:', file);
                fetch(`/personal-site/blogs/${file}?_=${new Date().getTime()}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Failed to load blog post');
                        }
                        return response.text();
                    })
                    .then(markdownContent => {
                        console.log('Blog post loaded successfully, rendering content');
                        displayBlogPost(markdownContent);
                        window.history.pushState({}, '', `/personal-site/blogs.html#${file}`);
                    })
                    .catch(error => {
                        console.error('Error loading blog post:', error);
                        blogListSection.innerHTML = `
                            <a href="#" class="back-to-list">← Back to all blogs</a>
                            <div class="blog-content">
                                <h2>Error Loading Blog Post</h2>
                                <p>Sorry, we couldn't load the blog post. Please try again later.</p>
                            </div>
                        `;
                    });
            }

            // Function to display a blog post
            function displayBlogPost(markdownContent) {
                const htmlContent = marked.parse(markdownContent);
                blogListSection.innerHTML = `
                    <a href="#" class="back-to-list">← Back to all blogs</a>
                    <div class="blog-content">${htmlContent}</div>
                `;

                // Add click handler to back button
                const backButton = blogListSection.querySelector('.back-to-list');
                backButton.onclick = (e) => {
                    e.preventDefault();
                    showBlogList();
                    window.history.pushState({}, '', '/personal-site/blogs.html');
                };

                // Fix image paths if needed
                document.querySelectorAll('.blog-content img').forEach(img => {
                    const originalSrc = img.getAttribute('data-original-src') || img.getAttribute('src');
                    const currentSrc = img.getAttribute('src');
                    
                    console.log('Checking image path:', originalSrc, 'Current:', currentSrc);
                    
                    let newSrc = currentSrc;
                    // Handle relative paths starting with ../assets/
                    if (originalSrc && originalSrc.includes('../assets/')) {
                        newSrc = originalSrc.replace('../assets/', '/assets/');
                    }
                    // Handle paths starting with /assets/
                    else if (originalSrc && originalSrc.startsWith('/assets/')) {
                        // Keep as is
                        newSrc = originalSrc;
                    }
                    // Handle paths starting with assets/
                    else if (originalSrc && originalSrc.startsWith('assets/')) {
                        newSrc = '/' + originalSrc;
                    }
                    
                    if (newSrc !== currentSrc) {
                        console.log('Updating image src:', currentSrc, '->', newSrc);
                        img.src = newSrc;
                    }
                    
                    // Add error handling for images
                    img.onerror = function() {
                        console.error('Failed to load image:', originalSrc, '→', this.src);
                        // Try alternative paths if loading fails
                        if (this.src.startsWith('/assets/')) {
                            console.log('Trying alternative path with /personal-site prefix');
                            this.src = '/personal-site' + this.src;
                        } else if (this.src.startsWith('/personal-site/assets/')) {
                            console.log('Trying alternative path without /personal-site prefix');
                            this.src = this.src.replace('/personal-site', '');
                        } else {
                            // Show error styling
                            this.style.border = '1px dashed red';
                            this.style.padding = '10px';
                            this.style.width = '100%';
                            this.style.height = 'auto';
                            this.style.display = 'flex';
                            this.style.justifyContent = 'center';
                            this.style.alignItems = 'center';
                            this.alt = 'Image failed to load: ' + originalSrc;
                        }
                    };
                });
            }

            // Initial load
            if (window.location.hash) {
                const blogFile = window.location.hash.slice(1);
                if (blogFiles.includes(blogFile)) {
                    loadAndDisplayBlogPost(blogFile);
                } else {
                    showBlogList();
                }
            } else {
                showBlogList();
            }

            // Handle browser back/forward buttons
            window.onpopstate = function() {
                if (window.location.hash) {
                    const blogFile = window.location.hash.slice(1);
                    if (blogFiles.includes(blogFile)) {
                        loadAndDisplayBlogPost(blogFile);
                    } else {
                        showBlogList();
                    }
                } else {
                    showBlogList();
                }
            };
        });
    </script>
</body>
</html>
